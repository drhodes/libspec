000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="75.7383" x="34.4941" y="2116.6572">and approve</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="140" x="39.6289" y="2257.4248"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="120" x="49.6289" y="2278.5635">Feature complete &#10003;</text><ellipse cx="109.6289" cy="2322.3936" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="109.6289" cy="2322.3936" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="66.3389" y2="2333.3936"/><rect fill="#FFF7ED" height="2267.0547" style="stroke:#FFF7ED;stroke-width:1;" width="645.9722" x="202.2578" y="66.3389"/><path d="M506.1045,197.0811 L506.1045,213.2139 L486.1045,217.2139 L506.1045,221.2139 L506.1045,237.3467 A0,0 0 0 0 506.1045,237.3467 L761.314,237.3467 A0,0 0 0 0 761.314,237.3467 L761.314,207.0811 L751.314,197.0811 L506.1045,197.0811 A0,0 0 0 0 506.1045,197.0811" fill="#FFFDE7" style="stroke:#F59E0B;stroke-width:0.5;"/><path d="M751.314,197.0811 L751.314,207.0811 L761.314,207.0811 L751.314,197.0811" fill="#FFFDE7" style="stroke:#F59E0B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.5601" x="512.1045" y="214.1479">Agent has read SKILL.md</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.2095" x="512.1045" y="229.2808">which contains the 8-step workflow.</text><rect fill="#FFF7ED" height="75.875" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="234.7109" x="294.7471" y="257.3467"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="304.7471" y="278.4854">STEP 1 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="63.2988" x="365.5908" y="278.4854">Edit Spec</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="214.7109" x="304.7471" y="292.4541">Decompose broad requirement into</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="174.5508" x="304.7471" y="306.4229">granular single-responsibility</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="163.8926" x="304.7471" y="320.3916">Ctx subclasses in spec/*.py</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="232.6309" x="295.7871" y="421.1592"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="305.7871" y="442.2979">STEP 2 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="61.1777" x="366.6309" y="442.2979">Diff Spec</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="86.7949" x="431.623" y="442.2979">(MANDATORY)</text><polygon fill="#FFF7ED" points="359.3127,678.9404,464.8923,678.9404,476.8923,690.9404,464.8923,702.9404,359.3127,702.9404,347.3127,690.9404,359.3127,678.9404" style="stroke:#EA580C;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="105.5796" x="359.3127" y="694.7485">Any spec changes?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="328.3044" y="688.3462">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="476.8923" y="688.3462">no</text><rect fill="#FFF7ED" height="47.9375" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="154.1504" x="232.2725" y="712.9404"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="134.1504" x="242.2725" y="734.0791">Review mutations and</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="109.4414" x="242.2725" y="748.0479">new requirements</text><rect fill="#FFF7ED" height="47.9375" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="216.8691" x="406.4229" y="712.9404"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.3145" x="416.4229" y="734.0791">Specs unchanged;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="196.8691" x="416.4229" y="748.0479">No implementation work needed</text><ellipse cx="514.8574" cy="791.8779" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="514.8574" cy="791.8779" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="263.9727" x="280.1162" y="822.8779"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="290.1162" y="844.0166">STEP 3 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="183.1289" x="350.96" y="844.0166">Sort Implementation Order</text><rect fill="#FFF7ED" height="61.9063" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="229.3848" x="297.4102" y="998.7529"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="188.0215" x="307.4102" y="1019.8916">Topologically sort components;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="209.3848" x="307.4102" y="1033.8604">Identify foundational requirements</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="107.8652" x="307.4102" y="1047.8291">to implement first</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="252.8281" x="285.6885" y="1080.6592"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="295.6885" y="1101.7979">STEP 4 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="171.9844" x="356.5322" y="1101.7979">Test Driven Development</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="153.5762" x="335.3145" y="1216.5342"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="345.3145" y="1237.6729">STEP 5 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="72.7324" x="406.1582" y="1237.6729">Implement</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="167.4277" x="328.3887" y="1406.3779"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="338.3887" y="1427.5166">STEP 6 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="86.584" x="399.2324" y="1427.5166">Code Quality</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="194.3047" x="314.9502" y="1542.2529"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="324.9502" y="1563.3916">STEP 7 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="113.4609" x="385.7939" y="1563.3916">Verify Spec Sync</text><polygon fill="#FFF7ED" points="371.0862,1718.1279,453.1189,1718.1279,465.1189,1730.9326,453.1189,1743.7373,371.0862,1743.7373,359.0862,1730.9326,371.0862,1718.1279" style="stroke:#EA580C;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="63.3467" x="371.0862" y="1728.3384">All changes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="82.0327" x="371.0862" y="1741.1431">accounted for?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="340.0779" y="1728.3384">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="465.1189" y="1728.3384">no</text><rect fill="#FFF7ED" height="47.9375" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="180.752" x="208.2578" y="1763.7373"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="160.752" x="218.2578" y="1784.876">Specs and implementation</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="79.6641" x="218.2578" y="1798.8447">are in sync &#10003;</text><path d="M636.1611,1767.5732 L636.1611,1783.7061 L616.1611,1787.7061 L636.1611,1791.7061 L636.1611,1807.8389 A0,0 0 0 0 636.1611,1807.8389 L843.23,1807.8389 A0,0 0 0 0 843.23,1807.8389 L843.23,1777.5732 L833.23,1767.5732 L636.1611,1767.5732 A0,0 0 0 0 636.1611,1767.5732" fill="#FFFDE7" style="stroke:#F59E0B;stroke-width:0.5;"/><path d="M833.23,1767.5732 L833.23,1777.5732 L843.23,1777.5732 L833.23,1767.5732" fill="#FFFDE7" style="stroke:#F59E0B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.9863" x="642.1611" y="1784.6401">Loop until diff shows</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0688" x="642.1611" y="1799.7729">no unimplemented changes.</text><rect fill="#FFF7ED" height="47.9375" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="181.1797" x="434.9814" y="1763.7373"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="101.4609" x="444.9814" y="1784.876">Return to STEP 5</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="161.1797" x="444.9814" y="1798.8447">(implement missing items)</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="145.7891" x="452.6768" y="1831.6748"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="125.7891" x="462.6768" y="1852.8135">STEP 5 &#8212; Implement</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="228.2363" x="411.4531" y="1939.6123"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="208.2363" x="421.4531" y="1960.751">STEP 7 &#8212; Verify Spec Sync (again)</text><polygon fill="#FFF7ED" points="412.1025,1983.5811,424.1025,1995.5811,412.1025,2007.5811,400.1025,1995.5811,412.1025,1983.5811" style="stroke:#EA580C;stroke-width:0.5;"/><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="270.4473" x="276.8789" y="2027.5811"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="57.0293" x="286.8789" y="2048.7197">STEP 8 &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="189.6035" x="347.7227" y="2048.7197">Author Git Commit Message</text><line style="stroke:#000000;stroke-width:1.5;" x1="202.2578" x2="202.2578" y1="66.3389" y2="2333.3936"/><rect fill="#F0FDF4" height="2267.0547" style="stroke:#F0FDF4;stroke-width:1;" width="370.5518" x="848.23" y="66.3389"/><rect fill="#FFF7ED" height="47.9375" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="261.043" x="854.23" y="353.2217"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="146.4141" x="864.23" y="374.3604">Write / update spec/*.py</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="241.043" x="864.23" y="388.3291">with new Requirement / Feature classes</text><rect fill="#FFF7ED" height="61.9063" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="212.4395" x="878.5317" y="1134.6279"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="159.0176" x="888.5317" y="1155.7666">Write failing tests for each</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="192.4395" x="888.5317" y="1169.7354">component in topological order;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="126.3457" x="888.5317" y="1183.7041">Run test suite &#8594; RED</text><rect fill="#FFF7ED" height="61.9063" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="247.2031" x="861.1499" y="1270.5029"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="227.2031" x="871.1499" y="1291.6416">Implement components to pass tests;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="199.2949" x="871.1499" y="1305.6104">Add REQUIREMENT-ID comments</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="172.5293" x="871.1499" y="1319.5791">in source for cross-reference</text><rect fill="#FFF7ED" height="33.9688" rx="12.5" ry="12.5" style="stroke:#EA580C;stroke-width:0.5;" width="162.9629" x="903.27" y="1352.4092"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.